<script>
(()=>{
 const root=document.querySelector('.wrap');
 const art=document.querySelector('#art');
 const canvas=document.querySelector('#field');
 const ctx=canvas.getContext('2d',{alpha:true});
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const points=Array.from({length:43},(_,i)=>({
  x:((Math.sin(i*29.73+7.1)*43758.5453)%1+1)%1,
  y:((Math.sin(i*11.27+9.3)*12734.771)%1+1)%1,
  phase:i*1.37, size:i%7===0?1.25:.65,
  speed:.12+.065*(i%4)
 }));
 let w=440,h=560,last=0,playing=!reduced.matches;
 function resize(){
  const r=root.getBoundingClientRect();w=(r.width&&r.width>0)?r.width:440;h=(r.height&&r.height>0)?r.height:560;
  const scale=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
 }
 new ResizeObserver(resize).observe(root); resize();
 function paint(t){
  ctx.clearRect(0,0,w,h);
  if(!reduced.matches){
    for(const p of points){
      const yy=(p.y+(t*.000012*p.speed))%1;
      const a=.14+Math.pow(.5+.5*Math.sin(t*.0011+p.phase),2)*.41;
      ctx.beginPath();ctx.fillStyle=`rgba(157,215,255,${a.toFixed(3)})`;
      ctx.arc(p.x*w,yy*h,p.size*w/440,0,6.283);ctx.fill();
    }
  }else{for(const p of points){ctx.beginPath();ctx.fillStyle='rgba(157,215,255,.22)';ctx.arc(p.x*w,p.y*h,p.size*w/440,0,6.283);ctx.fill()}}
  last=t;if(playing)requestAnimationFrame(paint);
 }
 if(playing)requestAnimationFrame(paint);else paint(0);
 const restart=()=>{if(reduced.matches)return;art.style.animation='none';const anims=art.querySelectorAll('*');for(const el of anims){el.style.animation='none'}void art.offsetWidth;art.style.removeProperty('animation');for(const el of anims){el.style.removeProperty('animation')}};
 root.addEventListener('click',restart);
 root.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();restart()}});
 if(matchMedia('(hover:hover) and (pointer:fine)').matches){
 root.addEventListener('pointermove',e=>{const r=root.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;art.style.setProperty('--tiltx',`${(-y*3.8).toFixed(2)}deg`);art.style.setProperty('--tilty',`${(x*4.6).toFixed(2)}deg`)});
 root.addEventListener('pointerleave',()=>{art.style.setProperty('--tiltx','0deg');art.style.setProperty('--tilty','0deg')});
 }
 reduced.addEventListener('change',e=>{playing=!e.matches;if(playing)requestAnimationFrame(paint);else paint(last)})
})();
</script>
