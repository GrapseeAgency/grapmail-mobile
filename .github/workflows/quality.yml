name: Quality checks

# Free automated quality checks: crash/stress with network drops, startup time,
# scroll smoothness, accessibility. See QUALITY-CHECKS.md for every rule.
# Separate from android.yml / ios.yml on purpose: nothing here gates a release.
on:
  schedule:
    - cron: "17 2 * * *"   # nightly 02:17 UTC
  workflow_dispatch:
    inputs:
      monkey_seed:
        description: Monkey / iOS stress seed (blank = quality/budgets.json)
        required: false
        default: ""
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "quality/**"
      - ".github/workflows/quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One debug APK, reused by the four emulator jobs.
  android-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Same guard as android.yml / build.yml: compileSdk 36 may be missing.
      - name: Ensure the compile SDK is installed
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null
          fi
      - name: Helper self-test
        run: python3 quality/logcat_crash.py --selftest
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quality-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  # Four checks, four emulators in parallel (public repo: Linux minutes are free).
  #   monkey  - FAILS on any crash/ANR of com.grapsee.grapmail
  #   startup - FAILS only when a median is > budget + 25 %
  #   jank    - warn-only (> 10 % janky frames)
  #   a11y    - warn-only
  android-emulator:
    name: Android ${{ matrix.check }}
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [monkey, startup, jank, a11y]
    env:
      APK: apk/app-debug.apk
      OUT: quality-out
      SEED_INPUT: ${{ github.event.inputs.monkey_seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-debug-apk
          path: apk
      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /usr/local/share/ghc /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ${{ matrix.check }} on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          # Animations stay ON for jank (they are what is measured) and are
          # disabled for the rest, matching android.yml.
          disable-animations: ${{ matrix.check != 'jank' }}
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash quality/android-${{ matrix.check }}.sh "$APK" "$OUT"
      - name: Upload ${{ matrix.check }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-android-${{ matrix.check }}
          path: quality-out/
          if-no-files-found: warn

  ios-stress-a11y:
    name: iOS stress + accessibility audit
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: GrapMail
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Resolve available simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -o "iPhone 16 Pro\|iPhone 16\|iPhone 15")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      - name: Run QualityStressUITests
        working-directory: ios
        env:
          # TEST_RUNNER_ prefix = xcodebuild passes it (prefix stripped) into the
          # UI-test runner's environment, read via ProcessInfo in the test.
          TEST_RUNNER_QUALITY_STRESS_SEED: ${{ github.event.inputs.monkey_seed || '20261123' }}
          TEST_RUNNER_QUALITY_STRESS_SECONDS: "180"
        run: |
          set -o pipefail
          xcodebuild test \
            -project GrapMail.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:GrapMailUITests/QualityStressUITests \
            -skipPackagePluginValidation \
            -resultBundlePath quality.xcresult \
            | tee /tmp/xcodebuild-quality.log | grep -E "Test Case|A11Y-|STRESS-|CRASH|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/xcodebuild-quality.log
      - name: Summarise
        if: always()
        run: |
          LOG=/tmp/xcodebuild-quality.log
          touch "$LOG"
          {
            echo "### iOS stress + accessibility audit"
            echo
            echo "$(grep -m1 -o 'STRESS-SEED:.*' $LOG || echo 'stress test did not start')"
            echo
            echo "$(grep -m1 -o 'STRESS-DONE:.*' $LOG || echo 'stress test did not finish - see CRASH lines / xcresult')"
            echo
            echo "Accessibility audit (warn-only): $(grep -m1 -o 'A11Y-TOTAL: [0-9]*' $LOG || echo 'A11Y-TOTAL: n/a')"
            echo
            echo "Network-drop simulation: **not run on iOS** (the app has no launch-argument offline mode)."
            echo
            echo '```'
            grep -o 'A11Y-ISSUE:.*' $LOG | sort -u | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -o 'A11Y-ISSUE:.*' $LOG | sort -u | head -n 20 | while read -r l; do echo "::warning title=iOS a11y::$l"; done || true
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ios-xcresult
          path: |
            ios/quality.xcresult
            /tmp/xcodebuild-quality.log
          if-no-files-found: warn
