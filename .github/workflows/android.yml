name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-test-screenshot:
    name: Build, live-test & screenshot (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # "responsive no matter what size" is a release gate, not a hope:
        # the same density-aware walk must pass on a large phone, a small
        # phone, and a tablet (520dp centering). The small-phone slot was
        # nexus_5, which the runner's current avdmanager rejects ("No device
        # found matching --device nexus_5") — pixel_4a is the small phone in
        # the pixel family that this SDK does ship (pixel_6/pixel_c prove it).
        include:
          - device: pixel_6
            api-level: 34
          - device: pixel_4a
            api-level: 34
          - device: pixel_c
            api-level: 34
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live signup walk on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}   # modern inset/cutout delivery —
          arch: x86_64                         # API 30 does not prove it
          target: google_apis
          profile: ${{ matrix.device }}
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/android-walk.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ matrix.device }}
          path: screenshots/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-screenshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: android-screenshots-pixel_6
          path: screenshots

      - name: Create release with APK + live screenshots
        uses: softprops/action-gh-release@v2
        with:
          name: GrapMail ${{ github.ref_name }} — Android
          body: |
            Built and live-tested by CI: the full signup + sign-in flow was
            walked on real Android 34 emulators (phone, small phone, and
            tablet) against the live account API, and every screen was
            screenshotted. The screenshots are attached.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            screenshots/*.png
