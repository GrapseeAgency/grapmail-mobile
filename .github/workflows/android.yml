name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-test-screenshot:
    name: Build, live-test & screenshot (${{ matrix.device }})
    runs-on: ubuntu-latest
    # 60 was right until the mailbox band landed: the walk now relaunches the app
    # once per snapshot screen, 15 security confirmations plus 21 mail screens,
    # each with its own settle wait, on three devices at once. The previous run
    # was cut at 1h0m by this ceiling with its walk still going — a timeout set
    # for a smaller walk is not evidence that the walk is slow.
    #
    # 90 then proved the same thing one level up: a runner whose launcher ANRs
    # repeatedly spends real time in recovery (each dismissal is a tap, a 3s wait
    # and a fresh dump), which is the walk working correctly on a bad machine
    # rather than a defect. Two of three devices finished inside 90; the third was
    # cut at 90m09s mid-recovery. The ceiling now has headroom over the worst
    # observed clean run instead of matching it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # "responsive no matter what size" is a release gate, not a hope:
        # the same density-aware walk must pass on a large phone, a small
        # phone, and a tablet (520dp centering). The small-phone slot is
        # resolved at run time, not hardcoded: the profile that used to hold
        # it (nexus_5) is gone from the runner's SDK, and `avdmanager`
        # rejected the name outright — the leg never booted an emulator and
        # failed before the walk could run. Guessing another name repeats
        # that. The compact entry therefore asks the runner what it actually
        # has and takes the smallest available.
        include:
          - device: pixel_6
            api-level: 34
          - device: compact
            api-level: 34
          - device: pixel_c
            api-level: 34
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the emulator profile
        id: profile
        run: |
          if [ "${{ matrix.device }}" != "compact" ]; then
            echo "device=${{ matrix.device }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Preference order, smallest first. pixel_4a is ~393dp wide and
          # pixel_6 ~411dp — four percent apart, which proves nothing new; a
          # 360dp/320dp profile is what the compact slot is for. Anything the
          # runner lacks is skipped rather than failed, and pixel_4a is the
          # last resort so the leg still boots something.
          avdmanager list device > /tmp/devices.txt 2>&1 || true
          for alias in nexus_4 nexus_s pixel_4a; do
            if grep -qE "id:[[:space:]]*${alias}([^a-z0-9]|$)" /tmp/devices.txt; then
              echo "device=$alias" >> "$GITHUB_OUTPUT"
              echo "compact profile: $alias"
              exit 0
            fi
          done
          echo "device=pixel_4a" >> "$GITHUB_OUTPUT"
          echo "no compact profile in this SDK — using pixel_4a (width coverage is weak)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live signup walk on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}   # modern inset/cutout delivery —
          arch: x86_64                         # API 30 does not prove it
          target: google_apis
          profile: ${{ steps.profile.outputs.device }}
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/android-walk.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Mailbox API surface matches the other platform
        # The sector was written on one platform and translated to the other, and
        # three real mismatches were found by a human reading both files: a helper
        # only one side had, and two attachment calls the model made that only one
        # client declared. This diff makes that check repeatable. It compares the
        # mail call names and the decoded DTO fields; private transport helpers are
        # the platform's own plumbing and are not compared.
        run: python3 scripts/api-parity.py

      - name: Mailbox honesty pins hold on both platforms
        # The plan's T1.3: mirror the web client's
        # grapmail-send-status-honesty.test.ts. Structural source assertions
        # rather than a mounted UI, because the behaviour lives inside a view
        # closure and the cost of mounting is an emulator per platform plus a
        # macOS runner for one of them — while the thing at risk is a word on a
        # screen.
        #
        # What it holds: the send receipt keeps `queued` distinct from `sent`
        # (collapsing them tells a sender external mail is delivered when the
        # relay has not tried yet); a message action travels in the URL path,
        # where the route reads it; permanent destruction is never one bulk tap
        # away; no remote HTML body gets a renderer; and the drawer offers no box
        # the server cannot read back.
        #
        # Deliberately different from the parity step above: that compares the
        # two platforms against each other, and two platforms can agree on the
        # same wrong thing. This compares both against the contract. Verified to
        # bite — three seeded regressions (a collapsed receipt, a Snoozed drawer
        # row, a permanent delete inside the bulk path) each failed the run.
        run: python3 scripts/mail-honesty.py --quiet

      - name: Mailbox screen set matches iOS
        # The band is defined once, in the walk scripts. If either side renames,
        # drops or invents a mail screen, "the same screens on both platforms"
        # stops being true and nothing else in CI would notice: Android's gate is
        # a fixed list and iOS's is a count, and two different sets can satisfy
        # both. Kept in both workflows so the failure names the platform that
        # drifted rather than the one that happened to run second.
        run: |
          # `account-` joined `mail-` here with the Phase-1 band: three of the
          # eight new frames are named `NN-account-*`, and a diff that only
          # watches `NN-mail-*` would let one platform drop or rename an
          # account screen invisibly — the exact hole this step exists for.
          grep -oE '"[0-9]{2,3}-(mail|account|e2e)-[a-z-]+"' ios/GrapMailUITests/ScreenshotWalkUITests.swift | tr -d '"' | sort -u > ios-mail.txt
          grep -oE '[0-9]{2,3}-(mail|account|e2e)-[a-z-]+' scripts/android-walk.sh | sort -u > and-mail.txt
          echo "iOS: $(wc -l < ios-mail.txt)  Android: $(wc -l < and-mail.txt)"
          if ! diff -u and-mail.txt ios-mail.txt; then
            echo "::error::the two walks photograph different mailbox screens"
            exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ steps.profile.outputs.device || matrix.device }}
          path: screenshots/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Build, live-test & publish the production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The job this replaces ran `assembleDebug` and published `app-debug.apk`
      # under a release name. A debug APK is debuggable, unminified, signed with
      # the Android debug key that every machine on earth already has, and
      # installable alongside itself — it is not a product artifact and calling it
      # one on the Releases page made the page say something false about the file
      # next to it. This job builds the release variant: R8, resource shrinking,
      # no debug flag.
      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Ephemeral signing identity: generated here, used once, never stored —
          # the private half is left on a runner that is about to be destroyed.
          # The founder's distribution key goes into CI_KEYSTORE_FILE/PASSWORD/ALIAS
          # as repository secrets and nothing in build.gradle.kts changes; until it
          # exists, the release page says the APK is test-signed, because a build
          # that cannot be updated over a different key is a decision, and it should
          # not be made silently by a CI file.
          KS=/tmp/ci-release.keystore
          PW=$(openssl rand -hex 24)
          keytool -genkeypair -v -keystore "$KS" -storepass "$PW" \
            -keypass "$PW" -alias grapmail-ci -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -dname "CN=GrapMail CI test signature (not the distribution key), OU=ephemeral, O=Grapsee, C=US" >&2
          # `export`, not `$GITHUB_ENV`. The first attempt wrote these to
          # GITHUB_ENV in this same step and ran gradlew on the line below it —
          # and GITHUB_ENV only reaches the NEXT step, so the build saw no
          # keystore, AGP applied no signing config, and it emitted
          # `app-release-unsigned.apk`. The prove step then failed on the missing
          # `app-release.apk` and nothing unverified was published, which is what
          # the gate is for. But a variable that has to be in the environment of
          # the command on the next line belongs in the environment, not in a
          # file the runner reads after the step is over.
          export CI_KEYSTORE_FILE="$KS"
          export CI_KEYSTORE_PASSWORD="$PW"
          export CI_KEYSTORE_ALIAS=grapmail-ci
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Prove the artifact is what the page will call it
        # Every claim here is read out of the APK, not out of the build command:
        # the package and version must match the tag, the signing must be present,
        # and the manifest must NOT carry the debuggable flag. Without this step
        # "production APK" is a sentence about a filename.
        run: |
          set -eu
          APK=android/app/build/outputs/apk/release/app-release.apk
          # An unsigned release is not a near-miss, it is the specific failure:
          # AGP happily builds it, names it differently, and a job that only
          # looked for "an apk in that folder" would install and publish a file no
          # device will accept. Say which file is there instead of guessing.
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::AGP emitted an UNSIGNED release — the signing config was not"
            echo "::error::applied, so the keystore env vars did not reach this build"
            ls -la android/app/build/outputs/apk/release/ >&2
            exit 1
          fi
          [ -f "$APK" ] || { echo "::error::no $APK to publish"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          head -2 /tmp/badging.txt
          grep -q "package: name='com.grapsee.grapmail'" /tmp/badging.txt \
            || { echo "::error::wrong applicationId in the release APK"; exit 1; }
          WANT=${GITHUB_REF_NAME#v}
          grep -q "versionName='$WANT'" /tmp/badging.txt \
            || { echo "::error::APK versionName is not $WANT — the tag and the build disagree"; exit 1; }
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Ew "debuggable"; then
            echo "::error::release APK is debuggable — that is a debug build with a release name"
            exit 1
          fi
          echo "manifest carries no android:debuggable"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'26'" || echo "note: minSdk line not found in badging"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # R8 problems are invisible to every gate this repo has: the code compiles,
      # the class exists, and the method the runtime needs is simply not in the
      # bytecode — which is exactly how `@JvmOverloads` cost eight runs a launcher
      # screenshot. A minified build therefore has to be RUN before it is published,
      # and the only honest way to run it here is the same live walk the debug build
      # passes, against this APK, on a real emulator.
      - name: Live-test the RELEASE APK on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/android-walk.sh android/app/build/outputs/apk/release/app-release.apk screenshots-release

      - name: Upload the release APK and its own screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            screenshots-release/*.png

      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          name: GrapMail ${{ github.ref_name }} — Android (release build)
          body: |
            ## What this file is

            `app-release.apk` — the **release** variant: R8 minification on, resources
            shrunk, `android:debuggable` absent from the manifest (the build asserts it
            by reading the APK back, not by trusting the Gradle task name).

            ## How it was verified

            * Built, installed and **live-walked on a real Android 34 emulator** by this
              workflow: the full signup → sign-in → security → recovery → mailbox flow,
              every screen photographed from the running app. The screenshots attached
              here are from *this* APK, not from the debug build.
            * The same walk on three device profiles (phone, small phone, tablet) passed
              on the debug variant in the run above.
            * `scripts/api-parity.py` — the two platforms' mail API surfaces match, and
              every capability the plan's T1.2 list names is callable on both.
            * `scripts/mail-honesty.py` — structural pins over both apps' sources.

            ## Signing — read this before distributing

            Signed with an **ephemeral CI key generated for this job and discarded after
            it**. That makes the APK installable and verifiable, but it is not the
            product's signing identity: an update signed with a different key cannot be
            installed over this one. To make this the real distribution artifact, add the
            founder's keystore as repository secrets (`CI_KEYSTORE_FILE` pointing at the
            decoded file, plus `CI_KEYSTORE_PASSWORD` and `CI_KEYSTORE_ALIAS`); the Gradle
            block already reads exactly those three and nothing else needs to change.

            ## Sector in this build

            Mailbox: labels that can be read, applied and removed; snooze with an undo
            that reaches the server; the unsubscribe offer behind a confirmation that
            names the destination and claims nothing else; dark mode across the mail
            band; and the app-wide crash this sector uncovered — a reflective ViewModel
            constructor that R8-era naming and eight emulator runs could not see.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            screenshots-release/*.png
          prerelease: false
          make_latest: "true"
