name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-test-screenshot:
    name: Build, live-test & screenshot (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live signup walk on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/android-walk.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-screenshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: android-screenshots
          path: screenshots

      - name: Create release with APK + live screenshots
        uses: softprops/action-gh-release@v2
        with:
          name: GrapMail ${{ github.ref_name }} — Android
          body: |
            Built and live-tested by CI: the full signup + sign-in flow was
            walked on a real Android 34 emulator against the live account API,
            and every screen was screenshotted. The screenshots are attached.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            screenshots/*.png
