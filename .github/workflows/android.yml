name: Android

on:
  push:
    branches: [main]
    tags: ["v0.0.1"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: Build and verify signed Android artifacts without publishing a release
        type: boolean
        default: false

# One run per ref at a time. Without this, every push queues another 30-minute
# walk behind the last one: a session that pushes five fixes waits 2.5 hours for
# the fifth to be tested, and every intermediate run reports a state the tree
# has already left. Cancelling the superseded run is the point — the newest
# commit is the only one whose verdict still matters. Tags get their own group
# (github.ref includes the tag), so a release run is never cancelled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    if: github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.signed_candidate)
    name: Build, live-test & screenshot (${{ matrix.device }})
    runs-on: ubuntu-latest
    # 60 was right until the mailbox band landed: the walk now relaunches the app
    # once per snapshot screen, 15 security confirmations plus 21 mail screens,
    # each with its own settle wait, on three devices at once. The previous run
    # was cut at 1h0m by this ceiling with its walk still going — a timeout set
    # for a smaller walk is not evidence that the walk is slow.
    #
    # 90 then proved the same thing one level up: a runner whose launcher ANRs
    # repeatedly spends real time in recovery (each dismissal is a tap, a 3s wait
    # and a fresh dump), which is the walk working correctly on a bad machine
    # rather than a defect. Two of three devices finished inside 90; the third was
    # cut at 90m09s mid-recovery. The ceiling now has headroom over the worst
    # observed clean run instead of matching it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # "responsive no matter what size" is a release gate, not a hope:
        # the same density-aware walk must pass on a large phone, a small
        # phone, and a tablet (520dp centering). The small-phone slot is
        # resolved at run time, not hardcoded: the profile that used to hold
        # it (nexus_5) is gone from the runner's SDK, and `avdmanager`
        # rejected the name outright — the leg never booted an emulator and
        # failed before the walk could run. Guessing another name repeats
        # that. The compact entry therefore asks the runner what it actually
        # has and takes the smallest available.
        include:
          - device: pixel_6
            api-level: 34
          - device: compact
            api-level: 34
          - device: pixel_c
            api-level: 34
    steps:
      - uses: actions/checkout@v4

      - name: Verify GrapMail app icons
        run: |
          python3 -m venv "$RUNNER_TEMP/grapmail-icons"
          "$RUNNER_TEMP/grapmail-icons/bin/python" -m pip install Pillow==11.3.0
          "$RUNNER_TEMP/grapmail-icons/bin/python" scripts/generate-grapmail-icons.py --check

      - name: Resolve the emulator profile
        id: profile
        run: |
          if [ "${{ matrix.device }}" != "compact" ]; then
            echo "device=${{ matrix.device }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Preference order, smallest first. pixel_4a is ~393dp wide and
          # pixel_6 ~411dp — four percent apart, which proves nothing new; a
          # 360dp/320dp profile is what the compact slot is for. Anything the
          # runner lacks is skipped rather than failed, and pixel_4a is the
          # last resort so the leg still boots something.
          avdmanager list device > /tmp/devices.txt 2>&1 || true
          for alias in nexus_4 nexus_s pixel_4a; do
            if grep -qE "id:[[:space:]]*${alias}([^a-z0-9]|$)" /tmp/devices.txt; then
              echo "device=$alias" >> "$GITHUB_OUTPUT"
              echo "compact profile: $alias"
              exit 0
            fi
          done
          echo "device=pixel_4a" >> "$GITHUB_OUTPUT"
          # The last resort stays green — a removed SDK profile is an infra
          # event, not an app defect, and killing three device legs over it
          # teaches nobody anything — but it may not stay SILENT: 393dp
          # beside 411dp proves no small-phone width, and the release gate's
          # claim depends on this leg actually being the small phone. The
          # annotation and the run summary are the loud part; the release
          # body tells readers to check the device matrix log.
          echo "::warning title=compact-fallback::no nexus_4/nexus_s in this SDK — the small-phone gate ran on pixel_4a (~393dp, close to pixel_6)"
          echo "Small-phone gate degraded to pixel_4a — width coverage weak, see walk log." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live signup walk on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}   # modern inset/cutout delivery —
          arch: x86_64                         # API 30 does not prove it
          target: google_apis
          profile: ${{ steps.profile.outputs.device }}
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/android-walk.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Mailbox API surface matches the other platform
        # The sector was written on one platform and translated to the other, and
        # three real mismatches were found by a human reading both files: a helper
        # only one side had, and two attachment calls the model made that only one
        # client declared. This diff makes that check repeatable. It compares the
        # mail call names and the decoded DTO fields; private transport helpers are
        # the platform's own plumbing and are not compared.
        run: python3 scripts/api-parity.py

      - name: Mailbox honesty pins hold on both platforms
        # The plan's T1.3: mirror the web client's
        # grapmail-send-status-honesty.test.ts. Structural source assertions
        # rather than a mounted UI, because the behaviour lives inside a view
        # closure and the cost of mounting is an emulator per platform plus a
        # macOS runner for one of them — while the thing at risk is a word on a
        # screen.
        #
        # What it holds: the send receipt keeps `queued` distinct from `sent`
        # (collapsing them tells a sender external mail is delivered when the
        # relay has not tried yet); a message action travels in the URL path,
        # where the route reads it; permanent destruction is never one bulk tap
        # away; no remote HTML body gets a renderer; and the drawer offers no box
        # the server cannot read back.
        #
        # Deliberately different from the parity step above: that compares the
        # two platforms against each other, and two platforms can agree on the
        # same wrong thing. This compares both against the contract. Verified to
        # bite — three seeded regressions (a collapsed receipt, a Snoozed drawer
        # row, a permanent delete inside the bulk path) each failed the run.
        run: python3 scripts/mail-honesty.py --quiet

      - name: Mailbox screen set matches iOS
        # The band is defined once, in the walk scripts. If either side renames,
        # drops or invents a mail screen, "the same screens on both platforms"
        # stops being true and nothing else in CI would notice: Android's gate is
        # a fixed list and iOS's is a count, and two different sets can satisfy
        # both. Kept in both workflows so the failure names the platform that
        # drifted rather than the one that happened to run second.
        run: |
          # `account-` joined `mail-` here with the Phase-1 band: three of the
          # eight new frames are named `NN-account-*`, and a diff that only
          # watches `NN-mail-*` would let one platform drop or rename an
          # account screen invisibly — the exact hole this step exists for.
          grep -oE '"[0-9]{2,3}-(mail|account|e2e)-[a-z-]+"' ios/GrapMailUITests/ScreenshotWalkUITests.swift | tr -d '"' | sort -u > ios-mail.txt
          grep -oE '[0-9]{2,3}-(mail|account|e2e)-[a-z-]+' scripts/android-walk.sh | sort -u > and-mail.txt
          echo "iOS: $(wc -l < ios-mail.txt)  Android: $(wc -l < and-mail.txt)"
          if ! diff -u and-mail.txt ios-mail.txt; then
            echo "::error::the two walks photograph different mailbox screens"
            exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ steps.profile.outputs.device || matrix.device }}
          path: screenshots/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Build and verify production APK and AAB
    if: github.ref_name == 'v0.0.1' && github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.signed_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify GrapMail app icons
        run: |
          python3 -m venv "$RUNNER_TEMP/grapmail-icons"
          "$RUNNER_TEMP/grapmail-icons/bin/python" -m pip install Pillow==11.3.0
          "$RUNNER_TEMP/grapmail-icons/bin/python" scripts/generate-grapmail-icons.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run source guardrails
        run: |
          python3 scripts/mail-honesty.py --quiet
          python3 scripts/api-parity.py

      - name: Resolve the production upload key
        env:
          FOUNDER_KEY_B64: ${{ secrets.CI_KEYSTORE_FILE }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.CI_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$FOUNDER_KEY_B64" || -z "$CI_KEYSTORE_PASSWORD" || -z "$CI_KEYSTORE_ALIAS" ]]; then
            echo "::error::Set CI_KEYSTORE_FILE, CI_KEYSTORE_PASSWORD and CI_KEYSTORE_ALIAS before building a signed release."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/grapmail-upload.jks"
          base64 --decode <<< "$FOUNDER_KEY_B64" > "$key"
          keytool -list -keystore "$key" -storepass:env CI_KEYSTORE_PASSWORD -alias "$CI_KEYSTORE_ALIAS" > /dev/null
          keytool -exportcert -keystore "$key" -storepass:env CI_KEYSTORE_PASSWORD -alias "$CI_KEYSTORE_ALIAS" > "$RUNNER_TEMP/grapmail-upload.der"
          # Pin the public certificate of the supplied production keystore.
          echo "34400558533b1e70639390b4dbe74e8ae66da38400215b7d49f88bd714a37b0f  $RUNNER_TEMP/grapmail-upload.der" | sha256sum --check --status \
            || { echo "::error::CI keystore does not match the approved GrapMail upload certificate"; exit 1; }
          {
            printf 'CI_KEYSTORE_FILE=%s\n' "$key"
            printf 'CI_KEYSTORE_PASSWORD=%s\n' "$CI_KEYSTORE_PASSWORD"
            printf 'CI_KEYSTORE_ALIAS=%s\n' "$CI_KEYSTORE_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Resolve the Firebase Android client config
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.CI_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICES_B64" ]]; then
            echo "::error::Set CI_GOOGLE_SERVICES_JSON to build the release with Firebase notifications."
            exit 1
          fi
          base64 --decode <<< "$GOOGLE_SERVICES_B64" > android/app/google-services.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          if not any(
              client["client_info"].get("android_client_info", {}).get("package_name") == "com.grapsee.grapmail"
              for client in config["client"]
          ):
              raise SystemExit("Firebase config does not contain com.grapsee.grapmail")
          PYTHON

      - name: Build the signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon testReleaseUnitTest

      - name: Prove the artifact is what the page will call it
        # Every claim here is read out of the APK, not out of the build command:
        # the package and version must match the tag, the signing must be present,
        # and the manifest must NOT carry the debuggable flag. Without this step
        # "production APK" is a sentence about a filename.
        run: |
          set -eu
          APK=android/app/build/outputs/apk/release/app-release.apk
          # An unsigned release is not a near-miss, it is the specific failure:
          # AGP happily builds it, names it differently, and a job that only
          # looked for "an apk in that folder" would install and publish a file no
          # device will accept. Say which file is there instead of guessing.
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::AGP emitted an UNSIGNED release — the signing config was not"
            echo "::error::applied, so the keystore env vars did not reach this build"
            ls -la android/app/build/outputs/apk/release/ >&2
            exit 1
          fi
          [ -f "$APK" ] || { echo "::error::no $APK to publish"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          head -2 /tmp/badging.txt
          grep -q "package: name='com.grapsee.grapmail'" /tmp/badging.txt \
            || { echo "::error::wrong applicationId in the release APK"; exit 1; }
          WANT=0.0.1
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" != "$WANT" ]]; then
            echo "::error::This release must use tag v$WANT"
            exit 1
          fi
          grep -q "versionCode='1'" /tmp/badging.txt \
            || { echo "::error::APK versionCode is not 1"; exit 1; }
          grep -q "versionName='$WANT'" /tmp/badging.txt \
            || { echo "::error::APK versionName is not $WANT — the tag and the build disagree"; exit 1; }
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Ew "debuggable"; then
            echo "::error::release APK is debuggable — that is a debug build with a release name"
            exit 1
          fi
          echo "manifest carries no android:debuggable"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'26'" || echo "note: minSdk line not found in badging"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/grapmail-apk-certs.txt"
          expected=$(sha256sum "$RUNNER_TEMP/grapmail-upload.der" | cut -d ' ' -f 1)
          actual=$(awk '/certificate SHA-256 digest:/ { print $NF }' "$RUNNER_TEMP/grapmail-apk-certs.txt")
          [[ "$actual" == "$expected" ]] || { echo "::error::APK signing certificate does not match the upload key"; exit 1; }
          echo "Verified signing certificate SHA-256: $actual"

          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/grapmail-aab-verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/grapmail-aab-verify.txt"
          keytool -printcert -jarfile "$AAB" -rfc > "$RUNNER_TEMP/grapmail-aab.pem"
          openssl x509 -in "$RUNNER_TEMP/grapmail-aab.pem" -outform DER > "$RUNNER_TEMP/grapmail-aab.der"
          cmp "$RUNNER_TEMP/grapmail-upload.der" "$RUNNER_TEMP/grapmail-aab.der"

      - name: Free disk space (emulator needs ~10GB)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools/* \
            /usr/local/lib/android/sdk/platforms/android-2* /usr/local/lib/android/sdk/system-images/android-2* \
            /usr/share/dotnet /usr/local/share/ghc /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the minified release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            bash scripts/android-release-launch.sh android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/grapmail-icons/bin/python"
            bash scripts/android-onboarding-render.sh "$RUNNER_TEMP/grapmail-icons/bin/python"

      - name: Upload onboarding diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-onboarding-diagnostics
          path: screenshots-release/*.png
          if-no-files-found: ignore

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grapmail-android-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            screenshots-release/*.png

      - name: Stage release downloads
        if: github.ref_type == 'tag'
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/GrapMail-${GITHUB_REF_NAME}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab download/GrapMail-${GITHUB_REF_NAME}.aab

      - name: Publish to the Releases page
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GrapMail ${{ github.ref_name }}
          body: |
            GrapMail 0.0.1 (version code 1).

            Use the AAB for Play Console and the APK for direct installation.
            Both artifacts are signed with the configured production upload key.
          files: |
            download/GrapMail-${{ github.ref_name }}.apk
            download/GrapMail-${{ github.ref_name }}.aab
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: "true"
