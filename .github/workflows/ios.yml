name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-test-screenshot:
    name: Build, live-test & screenshot (iPhone simulator)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: GrapMail
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve available simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -o "iPhone 16 Pro\|iPhone 16\|iPhone 15")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Build & run the live signup walk (UI tests)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project GrapMail.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath walk.xcresult

      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p screenshots
          if ! xcrun xcresulttool export attachments \
                 --path ios/walk.xcresult \
                 --output-path screenshots; then
            echo "attachment export failed — falling back to the directory export"
            xcrun xcresulttool export \
              --type directory --path ios/walk.xcresult --output-path screenshots_raw || true
            find screenshots_raw -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          fi
          ls -la screenshots/
          # The export chain above never aborts (a failed test still has to
          # upload what it captured), so without this check the job could go
          # green on an empty artifact while claiming the sector was screened.
          # The walk photographs 34 screens (8 signup, 9 hub + gate leg, 7 hub
          # rows, 13 post-write confirmations, 2 recovery, 2 restore/sign-in);
          # anything under 30 means it died part way, and the run must not be
          # read as a pass on screenshots.
          COUNT="$(find screenshots -name '*.png' | wc -l | tr -d ' ')"
          echo "exported $COUNT screenshot attachment(s)"
          if [ "$COUNT" -lt 30 ]; then
            echo "::error::only $COUNT screenshots exported — the walk did not produce its set"
            exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: error
