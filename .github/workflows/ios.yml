name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref at a time. Without this, every push queues another 30-minute
# walk behind the last one: a session that pushes five fixes waits 2.5 hours for
# the fifth to be tested, and every intermediate run reports a state the tree
# has already left. Cancelling the superseded run is the point — the newest
# commit is the only one whose verdict still matters — but only for PUSHES. A
# release run (dispatch or tag) is producing something, not reporting on the
# tree, so cancelling it mid-archive throws away the build it was making;
# tags additionally carry their own group and were never exposed to this.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-test-screenshot:
    name: Build, live-test & screenshot (iPhone simulator)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: GrapMail
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve available simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -o "iPhone 16 Pro\|iPhone 16\|iPhone 15")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Build & run the live signup walk (UI tests)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project GrapMail.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath walk.xcresult

      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p screenshots
          if ! xcrun xcresulttool export attachments \
                 --path ios/walk.xcresult \
                 --output-path screenshots; then
            echo "attachment export failed — falling back to the directory export"
            xcrun xcresulttool export \
              --type directory --path ios/walk.xcresult --output-path screenshots_raw || true
            find screenshots_raw -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          fi
          ls -la screenshots/

          # Name the frames. `export attachments` writes each PNG under a UUID and
          # pairs it with manifest.json, whose `suggestedHumanReadableName` is the
          # name the walk gave the screenshot. Renaming does two things: a person
          # can read the artifact, and the artifact can be checked screen by
          # screen. An earlier comment here claimed hashed names made that
          # impossible — it was true of the files and false of the manifest beside
          # them, which is why the gate below was only ever a count.
          #
          # Moved, not copied: leaving both names in the folder would double the
          # artifact and make the reported count say 124 under a comment that
          # explains 62. Two frames of one screen keep both, with a suffix, because
          # silently overwriting a duplicate would hide the fact that the walk
          # photographed the same screen twice.
          if [ -f screenshots/manifest.json ]; then
            python3 - <<'PY'
          import json, os, re, shutil
          d = "screenshots"
          # The walk's name, then `_<attempt>_<uuid>.png`. Stripping on a literal
          # `_0_` would break the moment a frame is captured on a second attempt,
          # so the attempt number is part of the pattern.
          SUFFIX = re.compile(r"_\d+_[0-9A-Fa-f-]{36}\.png$")
          moved, kept, unparsed = 0, 0, 0
          for group in json.load(open(os.path.join(d, "manifest.json"))):
              for a in group.get("attachments", []):
                  src, sug = a.get("exportedFileName"), a.get("suggestedHumanReadableName")
                  if not src or not sug:
                      continue
                  name = SUFFIX.sub(".png", sug)
                  if name == sug:
                      # Not the expected shape — keep the file under whatever name
                      # the exporter gave it rather than inventing one.
                      unparsed += 1
                      continue
                  p, q = os.path.join(d, src), os.path.join(d, name)
                  if not os.path.exists(p):
                      continue
                  if p == q:
                      moved += 1
                      continue
                  if os.path.exists(q):
                      stem = name[:-4]
                      n = 2
                      while os.path.exists(os.path.join(d, f"{stem}-{n}.png")):
                          n += 1
                      q = os.path.join(d, f"{stem}-{n}.png")
                      kept += 1
                  shutil.move(p, q)
                  moved += 1
          print(f"renamed {moved} screenshot(s) to the names the walk gave them"
                f" ({kept} duplicate frame(s) kept side by side,"
                f" {unparsed} attachment(s) with an unexpected name)")
          PY
          fi

          # The export chain above never aborts (a failed test still has to
          # upload what it captured), so without these checks the job could go
          # green on an empty artifact while claiming the sector was screened.
          #
          # The walk photographs 66 frames. The mailbox band is 30 of them, named
          # 60–89: 4 shot from the live home (60 list, 62 drawer, 67 search, 69 sort
          # sheet), 3 in dark (61 home, 88 thread, 89 labels), and 23 rendered by the
          # snapshot host because they need mail that a CI mailbox does not have. The
          # floor below is NOT the frame count: it is the point past which a run that
          # died part way is no longer plausible, and the names are enforced separately
          # further down, which is the check that actually means anything.
          COUNT="$(find screenshots -name '*.png' | wc -l | tr -d ' ')"
          echo "exported $COUNT screenshot attachment(s)"
          if [ "$COUNT" -lt 62 ]; then
            echo "::error::only $COUNT screenshots exported — the walk did not produce its set"
            exit 1
          fi

          # …and the mailbox band is required BY NAME, not by arithmetic. A count
          # says the walk finished; it cannot say WHICH screens it reached, and a
          # frame of the wrong screen still counts — the lesson of the eleven fake
          # screenshots and of the receipt frame that was photographing a copy of
          # its own screen. The names come from the test source, so this is the
          # same list the parity step diffs against Android's walk.
          #
          # If the manifest ever fails to appear, this goes red on purpose: an
          # artifact whose frames cannot be attributed to screens is not evidence,
          # however many files it holds.
          MISSING=""
          BAND="$(grep -oE '"[0-9]{2,3}-(mail|account|e2e)-[a-z-]+"' \
                   ios/GrapMailUITests/ScreenshotWalkUITests.swift | tr -d '"' | sort -u)"
          for want in $BAND; do
            [ -f "screenshots/$want.png" ] || MISSING="$MISSING $want"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::mail frames missing from the artifact:$MISSING"
            exit 1
          fi
          # Counted from the list rather than written here, so the sentence cannot
          # go stale the way the number above just did when the band grew.
          echo "all $(echo "$BAND" | wc -l | tr -d ' ') mailbox frames present by name"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Mailbox API surface matches the other platform
        # The sector was written on one platform and translated to the other, and
        # three real mismatches were found by a human reading both files: a helper
        # only one side had, and two attachment calls the model made that only one
        # client declared. This diff makes that check repeatable. It compares the
        # mail call names and the decoded DTO fields; private transport helpers are
        # the platform's own plumbing and are not compared.
        run: python3 scripts/api-parity.py

      - name: Mailbox honesty pins hold on both platforms
        # The plan's T1.3: mirror the web client's
        # grapmail-send-status-honesty.test.ts. Structural source assertions
        # rather than a mounted UI, because the behaviour lives inside a view
        # closure and the cost of mounting is an emulator per platform plus a
        # macOS runner for one of them — while the thing at risk is a word on a
        # screen.
        #
        # What it holds: the send receipt keeps `queued` distinct from `sent`
        # (collapsing them tells a sender external mail is delivered when the
        # relay has not tried yet); a message action travels in the URL path,
        # where the route reads it; permanent destruction is never one bulk tap
        # away; no remote HTML body gets a renderer; and the drawer offers no box
        # the server cannot read back.
        #
        # Deliberately different from the parity step above: that compares the
        # two platforms against each other, and two platforms can agree on the
        # same wrong thing. This compares both against the contract. Verified to
        # bite — three seeded regressions (a collapsed receipt, a Snoozed drawer
        # row, a permanent delete inside the bulk path) each failed the run.
        run: python3 scripts/mail-honesty.py --quiet

      - name: Mailbox screen set matches Android
        # The band is defined once, in the walk scripts. If either side renames,
        # drops or invents a mail screen, "the same screens on both platforms"
        # stops being true and nothing else in CI would notice — the iOS gate is
        # a count and the Android gate is a fixed list, and both can be satisfied
        # by two different sets.
        run: |
          grep -oE '"[0-9]{2,3}-(mail|account|e2e)-[a-z-]+"' ios/GrapMailUITests/ScreenshotWalkUITests.swift \
            | tr -d '"' | sort -u > ios-mail.txt
          grep -oE '[0-9]{2,3}-(mail|account|e2e)-[a-z-]+' scripts/android-walk.sh | sort -u > and-mail.txt
          echo "iOS: $(wc -l < ios-mail.txt)  Android: $(wc -l < and-mail.txt)"
          if ! diff -u and-mail.txt ios-mail.txt; then
            echo "::error::the two walks photograph different mailbox screens"
            exit 1
          fi

  release:
    name: Archive & upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 40
    # Pushes to main keep building and walking; only a tag or an explicit run
    # ships. The workflow-level concurrency above still applies, so a release
    # dispatched on main can be cancelled by a push to main — a tag carries its
    # own group and never is.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      SCHEME: GrapMail
      # Job scope, not step scope: the gate reads them, and the install steps
      # CONSUME them — a secret declared only in the gate's env would make every
      # later step see an empty variable and fail somewhere confusing instead of
      # here, loudly, by name.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
      BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
      APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run without the signing secrets
        # A missing secret must end the run RED naming what is absent. A quiet
        # skip would print a green row over a release that never happened — the
        # same lie as a count gate satisfied by the wrong screenshots. A
        # dispatch run before the secrets exist is how this is met in practice:
        # the failure is the checklist.
        run: |
          MISSING=""
          for VAR in APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8 BUILD_CERTIFICATE_P12 BUILD_CERTIFICATE_PASSWORD APPSTORE_PROVISIONING_PROFILE; do
            [ -n "${!VAR}" ] || MISSING="$MISSING $VAR"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::release secrets absent:$MISSING — nothing was archived or uploaded."
            echo "Create them under the repository's Settings › Secrets › Actions and re-run the job."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install the distribution certificate
        # A throwaway keychain, not the runner's login one: the P12 holds the
        # private key that signs the build, and it must outlive xcodebuild's
        # codesign invocation without ever touching a keychain a later step
        # could confuse for it. `-A` on import and the partition list below
        # are what let codesign reach the key headlessly, without a prompt.
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/grapmail-release.keychain-db"
          echo "$BUILD_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install the App Store provisioning profile
        # The profile is read back, not trusted: if it is not the store profile
        # the export needs, the run must say so here instead of three steps
        # later inside codesign's own wall of output.
        run: |
          PP_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          echo "$APPSTORE_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo missing)
          echo "profile $NAME ($UUID), aps-environment=$APS"
          if [ "$APS" != "production" ]; then
            echo "::error::APPSTORE_PROVISIONING_PROFILE is not a production (App Store) profile — aps-environment is $APS"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        # One key file serves every step: archive and export both authenticate
        # through it by explicit path (-authenticationKeyPath), and the export's
        # destination=Upload reuses it for the App Store Connect transfer.
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Archive
        working-directory: ios
        # DEVELOPMENT_TEAM on the command line outranks the project's committed
        # empty value — the injection point that keeps the team id out of the
        # repository. -allowProvisioningUpdates lets archive resolve signing
        # through the API key rather than interactive prompts.
        run: |
          xcodebuild archive \
            -project GrapMail.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GrapMail.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: The build must name the tag's own version
        # Android's release gate refuses a package whose versionName disagrees
        # with the tag; an iOS build self-reporting a different marketing
        # version is the same disagreement kept quiet. Tag runs only — a
        # dispatch run has no version to agree with.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          WANT="${GITHUB_REF_NAME#v}"
          GOT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/GrapMail.xcarchive/Products/Applications/GrapMail.app/Info.plist")
          echo "tag wants $WANT, archive reports $GOT"
          [ "$GOT" = "$WANT" ] || {
            echo "::error::archive's CFBundleShortVersionString is $GOT, but the tag says $WANT — the tag and the build disagree"
            exit 1
          }

      - name: Export & upload the IPA to App Store Connect
        # destination=Upload makes -exportArchive itself validate and upload
        # through the same API key — one tool, no deprecated altool hop, and a
        # failed upload fails THIS step instead of a later one. The .ipa is
        # still written to the export path first, so the artifact step below
        # has something to keep even when the upload is refused.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.grapsee.grapmail</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>Upload</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GrapMail.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload the IPA for the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: |
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
