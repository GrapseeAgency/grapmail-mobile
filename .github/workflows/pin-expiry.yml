name: Pin expiry

# Weekly check of security/api-pins.json, the certificate pins both apps
# compile in (Android: android/app/build.gradle.kts; iOS: ios/GrapMail/ApiPins.swift):
#   - the JSON is well formed and holds at least two real pins;
#   - every pinned host's LIVE chain still contains a pinned key (a mismatch
#     means every pinned API call fails once enforcement is on);
#   - `expires` is more than 30 days away. After that date both apps silently
#     stop pinning (fail-open, OWASP MASTG-TEST-0022), so it has to be visible
#     here long before it happens;
#   - ios/GrapMail/ApiPins.swift was regenerated after the last JSON edit.
# On failure it opens one issue (or updates the open one) and the run goes red;
# when the check passes again it closes that issue.
#
# NOTE: GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. If this repo goes quiet, re-enable the workflow in
# the Actions tab, or the reminder stops without saying so.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - security/api-pins.json
      - ios/GrapMail/ApiPins.swift
      - scripts/check-api-pins.py
      - scripts/generate-pins.py
      - .github/workflows/pin-expiry.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: pin-expiry
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE: "Certificate pins need attention (security/api-pins.json)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 3.13+ so the checker reads the VERIFIED chain, trust anchor included
      # (ssl.SSLSocket.get_verified_chain); older Pythons fall back to openssl.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check pins (schema, live chains, expiry, generated Swift)
        id: check
        run: |
          set +e
          report="$RUNNER_TEMP/pin-report.md"
          python3 scripts/check-api-pins.py --report "$report"
          check=$?
          gen_out="$(python3 scripts/generate-pins.py --check 2>&1)"
          gen=$?
          {
            echo
            echo "## Generated Swift"
            if [ "$gen" -eq 0 ]; then echo "- OK: $gen_out"; else echo "- FAIL: $gen_out"; fi
          } >> "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          if [ "$check" -ne 0 ] || [ "$gen" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the open tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.check.outputs.report }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$RUNNER_TEMP/issue.md"
          {
            cat "$REPORT"
            echo
            echo "Latest failing run: $run_url"
            echo
            echo "_Opened by .github/workflows/pin-expiry.yml. It closes itself when the check passes again._"
          } > "$body"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file "$body"
            gh issue comment "$NUMBER" --body "Still failing on $(date -u +%F): $run_url"
          else
            gh label create pin-expiry --color B60205 \
              --description "Certificate pin set check failed" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --body-file "$body" --label pin-expiry \
              || gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi

      - name: Close the tracking issue once healthy
        if: steps.check.outputs.failed == 'false' && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue close "$NUMBER" --comment \
            "The pin check passes again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail the run when the check failed
        if: steps.check.outputs.failed == 'true'
        run: exit 1
