<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme: light dark; font: 15px system-ui; }
body { margin: 0; }
nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid GrayText; }
button, select { min-height: 40px; min-width: 40px; border: 0; border-radius: 6px; background: ButtonFace; color: ButtonText; font-size: 14px; }
#message { padding: 12px 8px; min-height: 145px; outline: none; overflow-wrap: anywhere; white-space: pre-wrap; }
#message:empty::before { content: attr(aria-label); color: GrayText; pointer-events: none; }
#message img { max-width: 100%; height: auto; border-radius: 4px; }
#message img[data-missing] { min-width: 60px; min-height: 30px; outline: 1px dashed GrayText; }
</style>
</head>
<body>
<nav aria-label="Text formatting">
  <button type="button" data-command="bold" aria-label="Bold"><b>B</b></button>
  <button type="button" data-command="italic" aria-label="Italic"><i>I</i></button>
  <button type="button" data-command="underline" aria-label="Underline"><u>U</u></button>
  <button type="button" data-command="strikeThrough" aria-label="Strikethrough"><s>S</s></button>
  <button type="button" data-command="insertUnorderedList">Bullets</button>
  <button type="button" data-command="insertOrderedList">Numbered</button>
  <select data-command="foreColor" aria-label="Text color">
    <option value="">Text color</option><option value="#202124">Black</option>
    <option value="#2458a6">Blue</option><option value="#ad2424">Red</option>
    <option value="#187448">Green</option>
  </select>
  <select data-command="backColor" aria-label="Highlight color">
    <option value="">Highlight</option><option value="#ffea94">Yellow</option>
    <option value="#cfe3ff">Blue</option><option value="#fbd3e3">Pink</option>
  </select>
  <select data-command="fontName" aria-label="Font">
    <option value="">Font</option><option value="Arial">Sans serif</option>
    <option value="Georgia">Serif</option><option value="Courier New">Monospace</option>
  </select>
  <button type="button" data-command="fontSize" data-value="4">Larger</button>
  <button type="button" data-command="removeFormat">Clear</button>
  <button type="button" data-action="image" aria-label="Insert image">Image</button>
</nav>
<div id="message" role="textbox" aria-label="Write your message" aria-multiline="true" contenteditable="true"></div>
<script>
const message = document.getElementById('message');
const allowed = new Set(['P', 'DIV', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'STRIKE', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'SPAN', 'FONT', 'A']);
// Images placed with "Insert image": the native app uploads the file, then calls
// insertImage with its Content-ID and a small preview. The editor shows the
// preview; the published HTML refers to the image as cid:<id>, which is how it
// travels inside the message.
const previews = new Map();
const CID = /^[^\s"'<>]{1,250}$/;
function cidOf(element) {
  const own = element.getAttribute('data-cid');
  if (own && CID.test(own)) return own;
  const src = element.getAttribute('src') || '';
  return src.startsWith('cid:') && CID.test(src.slice(4)) ? src.slice(4) : null;
}
function copyImage(child, publishing) {
  const cid = cidOf(child);
  if (!cid) return null;
  const image = document.createElement('img');
  const alt = (child.getAttribute('alt') || '').slice(0, 200);
  image.setAttribute('alt', alt);
  const width = parseInt(child.getAttribute('width') || '', 10);
  if (width > 0 && width <= 1200) image.setAttribute('width', String(width));
  if (publishing) {
    image.setAttribute('src', 'cid:' + cid);
    image.setAttribute('style', 'max-width:100%;height:auto;border:0');
  } else {
    image.setAttribute('data-cid', cid);
    const preview = previews.get(cid);
    if (preview) image.setAttribute('src', preview);
    else image.setAttribute('data-missing', '');
  }
  return image;
}
const excluded = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'FORM', 'SVG', 'MATH', 'TEMPLATE']);
const semantic = { B: 'strong', I: 'em', STRIKE: 's' };

function copyStyle(child, element) {
  const styles = child.style;
  for (const name of ['color', 'backgroundColor']) {
    const value = styles[name] || (name === 'color' && child.tagName === 'FONT' ? child.getAttribute('color') : '');
    if (value && /^(?:#[0-9a-f]{3,8}|rgba?\([\d, .%]+\)|[a-z]+)$/i.test(value)) element.style[name] = value;
  }
  if (/^(?:bold|[6-9]00)$/.test(styles.fontWeight)) element.style.fontWeight = 'bold';
  if (styles.fontStyle === 'italic') element.style.fontStyle = 'italic';
  if (/^(?:underline|line-through)$/.test(styles.textDecorationLine)) element.style.textDecoration = styles.textDecorationLine;
  if (/^(?:\d{1,2}(?:px|pt)|small|medium|large)$/.test(styles.fontSize)) element.style.fontSize = styles.fontSize;
  const font = (styles.fontFamily || child.getAttribute('face') || '').replace(/["']/g, '');
  if (['Arial', 'Georgia', 'Courier New'].includes(font)) element.style.fontFamily = font;
  if (child.tagName === 'FONT' && child.getAttribute('size') === '4') element.style.fontSize = '18px';
  if (child.tagName === 'A') {
    try {
      const url = new URL(child.getAttribute('href'));
      if (['https:', 'http:', 'mailto:'].includes(url.protocol)) element.href = url.href;
    } catch {}
  }
}
function copyContent(source, target, publishing = false) {
  for (const child of source.childNodes) {
    if (child.nodeType === Node.TEXT_NODE) {
      target.append(document.createTextNode(child.textContent));
    } else if (child.nodeType === Node.ELEMENT_NODE && !excluded.has(child.tagName)) {
      if (child.tagName === 'IMG') {
        const image = copyImage(child, publishing);
        if (image) target.append(image);
      } else if (allowed.has(child.tagName)) {
        const element = document.createElement(semantic[child.tagName] || (child.tagName === 'FONT' ? 'span' : child.tagName.toLowerCase()));
        copyStyle(child, element);
        copyContent(child, element, publishing);
        target.append(element);
      } else {
        copyContent(child, target, publishing);
      }
    }
  }
}

window.setDraft = (text, html) => {
  lastSelection = undefined;
  if (html) {
    const template = document.createElement('template');
    const safe = document.createDocumentFragment();
    template.innerHTML = html;
    copyContent(template.content, safe);
    if (safe.textContent.trim() || safe.querySelector('img')) {
      message.replaceChildren(safe);
      return;
    }
  }
  message.textContent = text;
};

function publish() {
  const cleaned = document.createElement('div');
  copyContent(message, cleaned, true);
  const text = message.innerText;
  const formatted = cleaned.querySelector('strong,em,u,s,ul,ol,blockquote,a[href],[style],img');
  const draft = { text, html: formatted ? cleaned.innerHTML : null };
  if (window.webkit?.messageHandlers?.draftChanged) window.webkit.messageHandlers.draftChanged.postMessage(draft);
  else if (window.GrapMailDraft) window.GrapMailDraft.changed(JSON.stringify(draft));
}

let lastSelection;
document.addEventListener('selectionchange', () => {
  const selection = window.getSelection();
  if (selection.rangeCount && message.contains(selection.anchorNode) && message.contains(selection.focusNode)) {
    lastSelection = selection.getRangeAt(0).cloneRange();
  }
});
const toolbar = document.querySelector('nav');
toolbar.addEventListener('pointerdown', event => {
  if (event.target.closest('button')) event.preventDefault();
});
toolbar.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (button?.dataset.action === 'image') {
    if (window.webkit?.messageHandlers?.pickImage) window.webkit.messageHandlers.pickImage.postMessage('');
    else if (window.GrapMailDraft?.pickImage) window.GrapMailDraft.pickImage();
    return;
  }
  if (button?.dataset.command) applyFormat(button.dataset.command, button.dataset.value ?? null);
});

// Called by the app once an image is uploaded. Inserted where the cursor was.
window.insertImage = (cid, preview, alt, width) => {
  if (!CID.test(cid || '')) return;
  if (typeof preview === 'string' && preview.startsWith('data:image/')) previews.set(cid, preview);
  const image = document.createElement('img');
  image.setAttribute('data-cid', cid);
  image.setAttribute('alt', String(alt || '').slice(0, 200));
  if (width > 0) image.setAttribute('width', String(Math.min(600, Math.round(width))));
  if (previews.has(cid)) image.setAttribute('src', previews.get(cid));
  message.focus();
  const selection = window.getSelection();
  if (lastSelection && message.contains(lastSelection.commonAncestorContainer)) {
    selection.removeAllRanges();
    selection.addRange(lastSelection);
  }
  if (selection.rangeCount && message.contains(selection.anchorNode)) {
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(image);
    range.setStartAfter(image);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  } else {
    message.append(image);
  }
  publish();
};
// Called by the app with text dropped on the compose screen. Typed as plain
// text where the cursor was (the end when there was none), like a paste.
window.insertText = (text) => {
  if (typeof text !== 'string' || !text) return;
  message.focus();
  const selection = window.getSelection();
  selection.removeAllRanges();
  if (lastSelection && message.contains(lastSelection.commonAncestorContainer)) {
    selection.addRange(lastSelection);
  } else {
    const end = document.createRange();
    end.selectNodeContents(message);
    end.collapse(false);
    selection.addRange(end);
  }
  document.execCommand('insertText', false, text);
  publish();
};
toolbar.addEventListener('change', event => {
  const select = event.target.closest('select');
  if (select?.value) applyFormat(select.dataset.command, select.value);
  if (select) select.selectedIndex = 0;
});
function applyFormat(command, value) {
  message.focus();
  if (lastSelection && message.contains(lastSelection.commonAncestorContainer)) {
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(lastSelection);
  }
  document.execCommand(command, false, value);
  publish();
}
message.addEventListener('input', publish);
message.addEventListener('paste', event => {
  event.preventDefault();
  document.execCommand('insertText', false, event.clipboardData?.getData('text/plain') ?? '');
});
message.addEventListener('drop', event => event.preventDefault());
</script>
</body>
</html>
