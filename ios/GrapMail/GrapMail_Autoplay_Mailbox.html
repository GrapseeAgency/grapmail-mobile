<style id="native-host-fit">
/* NATIVE HOST MODE — added when this page is bundled in the GrapMail apps.
   The welcome screen owns the backdrop and sizes this view to the artwork's
   exact 400x440 box, so the page must fill that box and paint no background
   of its own; otherwise a second, slightly different navy rectangle shows
   behind/around the envelope. Animation rules are untouched. */
html, body { background: transparent !important; }
body { display: block !important; min-height: 0 !important; margin: 0 !important; }
/* Fixed to the WebView viewport: percentage heights on html/body resolve to
   0 in the embedded document, so the frame is anchored to the viewport itself
   and the artwork fills it exactly. */
.stage {
  position: fixed !important;
  inset: 0 !important;
  display: block !important;
  height: auto !important;
  min-height: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
}
.mail-hero {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  aspect-ratio: auto !important;
}
</style>
</head>

<script>/* GrapMail Living Mailbox — automated, NON-INTERACTIVE product tour.
 * No clicks are necessary. The 400×440 SVG, phone and envelope never move.
 * UI is real HTML clipped inside the original x84,y58,w232,h281 mini screen.
 * All data and activity are illustrative and LOCAL; no credentials or network.
 */
(() => {
  'use strict';
  const surface = document.getElementById('appSurface');
  const screen = document.getElementById('phoneScreen');
  const notice = document.getElementById('insideNotice');
  const cursor = document.getElementById('touchCursor');
  const fx = document.getElementById('screenEffects');
  const hero = document.getElementById('hero');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CLOCK = { tap: reduceMotion ? 15 : 185, transition: reduceMotion ? 12 : 205, hold: 660 };
  const TOUR_SPEED = 0.85; // Fast but readable, GPU-composited motion remains smooth.
  let loop = 0;
  let current = 'inbox';
  let activeId = null;
  let lastArchived = null;
  let category = 'All';
  let folder = 'Inbox';
  let settings = { focus:false, private:true, light:false, notifications:true };

  const seed = [
    {id:'notion', sender:'Notion', initials:'N', color:'blue', subject:'Your workspace digest', preview:"Here's what's new in your workspace…", time:'8:47 AM', category:'Work', unread:true, folder:'Inbox', body:'Here is your weekly workspace digest. Your team completed 8 tasks and shared 3 new updates. Keep your projects moving with a cleaner, calmer inbox.'},
    {id:'calendar', sender:'Calendar', initials:'▦', color:'calendar', subject:'Weekly schedule', preview:'Your agenda is ready.', time:'7:31 AM', category:'Work', unread:false, folder:'Inbox', body:'You have 3 events this week. Design review is on Thursday at 10:30 AM. You can respond right here.'},
    {id:'dribbble', sender:'Dribbble', initials:'◉', color:'pink', subject:'New shots for you', preview:'Explore new inspiration…', time:'Yesterday', category:'Social', unread:false, folder:'Inbox', body:'A handpicked collection of the latest UI and product design inspiration is ready for you.'},
    {id:'security', sender:'GrapMail Security', initials:'✓', color:'green', subject:'Your privacy report', preview:'Your account is protected.', time:'Yesterday', category:'Updates', unread:false, folder:'Inbox', body:'Your privacy checklist is up to date. This security message is an example in the interactive demo.'},
    {id:'team', sender:'Product Team', initials:'P', color:'violet', subject:'Design handoff', preview:'Please review the latest screens.', time:'Mon', category:'Work', unread:true, folder:'Inbox', body:'The design handoff is ready for review, including the updated component library and accessibility checklist.'},
    {id:'offers', sender:'Weekend Picks', initials:'W', color:'amber', subject:'Today’s highlights', preview:'A few stories we thought you’d like.', time:'Mon', category:'Updates', unread:false, folder:'Inbox', body:'A short digest of thoughtful recommendations.'},
    {id:'sam', sender:'Sam Rivera', initials:'S', color:'navy', subject:'Quick check-in', preview:'Can we catch up this week?', time:'Sun', category:'Social', unread:true, folder:'Inbox', body:'Hey! Are you free for a quick catch-up this week?'},
    {id:'design', sender:'Design Weekly', initials:'D', color:'pink', subject:'Fresh ideas', preview:'Five great articles for you.', time:'Sun', category:'Updates', unread:false, folder:'Inbox', body:'A curated selection of design articles.'},
    {id:'report', sender:'Analytics', initials:'A', color:'green', subject:'Monthly report ready', preview:'View your latest metrics.', time:'Fri', category:'Work', unread:false, folder:'Inbox', body:'Your monthly analytics report is ready.'},
    {id:'pulse', sender:'Studio', initials:'S', color:'violet', subject:'Project Pulse', preview:'See what the team shipped.', time:'Thu', category:'Work', unread:false, folder:'Inbox', body:'The team launched two new features this week.'},
    {id:'news', sender:'The Brief', initials:'B', color:'navy', subject:'Thursday briefing', preview:'What matters today.', time:'Thu', category:'Updates', unread:false, folder:'Inbox', body:'A concise briefing with this week’s key topics.'},
    {id:'event', sender:'Events', initials:'E', color:'calendar', subject:'You’re invited', preview:'An event is coming up.', time:'Wed', category:'Social', unread:false, folder:'Inbox', body:'You are invited to a community event this weekend.'}
  ];
  let messages = [];
  let toastJob = null;
  const delay = async (ms) => { // Prevent giant timer backlogs when the tab is in the background.
    ms *= TOUR_SPEED;
    if (reduceMotion) ms = Math.max(80, Math.min(ms, 280));
    const start = performance.now();
    let elapsed = 0;
    while (elapsed < ms) {
      if (document.hidden) { await new Promise(r => setTimeout(r, 150)); continue; }
      const next = Math.min(ms - elapsed, 80);
      await new Promise(r => setTimeout(r, next));
      elapsed = performance.now() - start;
    }
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons = {
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    back:'<path d="m15 18-6-6 6-6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
    more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM11 13l11-11"/>',
    star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3L7 14.2l-5-4.9 6.9-1L12 2Z"/>',
    close:'<path d="M5 5 19 19M19 5 5 19"/>',
    check:'<path d="m4 12 5 5 11-11"/>',
    reply:'<path d="M10 9 5 12l5 3M5 12h9a5 5 0 0 1 5 5"/>',
    paperclip:'<path d="m21 11-8.5 8.5a6 6 0 0 1-8.5-8.5L13 2a4 4 0 0 1 6 6l-9 9a2 2 0 0 1-3-3l8-8"/>',
    archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 14h4"/>',
    trash:'<path d="M4 7h16M8 7V4h8v3M6 7l1 14h10l1-14"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    folder:'<path d="M3 6h7l2 3h9v11H3z"/>',
    lock:'<rect x="5" y="10" width="14" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'
  };
  const svgIcon = (name) => `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.more}</svg>`;
  const avatar = m => `<div class="avatar ${esc(m.color)}">${esc(m.initials)}</div>`;
  const count = () => messages.filter(m => m.folder === 'Inbox' && !m.snooze).length;
  const init = () => {
    messages = seed.map(m => ({...m,star:false,pin:false,label:'',snooze:false}));
    folder = 'Inbox'; category='All'; settings = {focus:false,private:true,light:false,notifications:true};
    screen.classList.remove('light'); lastArchived=null;
  };
  function header(title='Inbox',opts={}) {
    const left = opts.back ? 'back' : 'menu';
    const right = opts.right === 'send' ? 'send' : opts.right === 'more' ? 'more' : opts.right === 'close' ? 'close' : 'search';
    return `<div class="ui-head"><div class="ui-icon">${svgIcon(left)}</div><span class="ui-title">${esc(title)}</span>${opts.count !== undefined ? `<span class="ui-count">(${opts.count})</span>`:''}<div class="header-spacer"></div>${opts.demoDot ? '<span class="ui-bubble"></span>':''}<div class="ui-icon">${svgIcon(right)}</div></div>`;
  }
  function swap(html, name='inbox') {
    current=name;
    surface.innerHTML=html;
    const v=surface.querySelector('.view');
    if(v) v.classList.add('enter');
  }
  function row(m,compact=false) {
    return `<div class="mail-row ${m.unread?'':'read'} ${compact?'compact':''}" data-id="${esc(m.id)}">
      ${avatar(m)}<div class="msg-details"><div class="sender">${esc(m.sender)}</div><div class="row-subject">${esc(m.subject)}</div><div class="row-preview">${esc(m.preview)}</div>${m.label?`<span class="tiny-label">${esc(m.label)}</span>`:''}</div>
      <span class="time">${esc(m.time)}</span>${m.unread?'<i class="unread-mark"></i>':''}${m.star?'<span class="star-inline">★</span>':''}${m.pin?'<span class="pin-tag">⌃</span>':''}</div>`;
  }
  function inbox(where=folder,filter=category,selection=false) {
    folder=where;category=filter;
    let shown=messages.filter(m => m.folder===where && !m.snooze);
    if(where==='Inbox' && filter!=='All') shown=shown.filter(m=>m.category===filter);
    if(settings.focus && where==='Inbox')shown=shown.filter(m=>m.category==='Work');
    shown.sort((a,b)=>Number(b.pin)-Number(a.pin));
    const counter=where==='Inbox' ? count() : shown.length;
    const segments = where==='Inbox' && filter!=='All' ? `<div class="segment">${['All','Work','Social','Updates'].map(s=>`<span class="${s===filter?'active':''}">${s}</span>`).join('')}</div>` : '';
    const rows=shown.length?shown.map(m=>row(m)).join(''):`<div class="centered"><div class="zero-icon">✧</div><div class="card-title">All caught up</div><div class="micro">Nothing in ${esc(where.toLowerCase())} right now.</div></div>`;
    swap(header(selection?'Select messages':where,{count:counter, right:selection?'more':'search',demoDot:true})+
      `<div class="ui-body"><div class="view">${segments}${rows}</div></div>`,'inbox');
  }
  function reader(id,extras={}) {
    activeId=id;
    const m=messages.find(v=>v.id===id) || messages[0];
    m.unread=false;
    const summary = extras.summary ? `<div class="card"><div class="eyebrow">Quick summary · Demo</div><div class="micro">${esc(m.sender)} shares an update. Review it, then respond in a tap.</div></div>` : '';
    const thread = extras.thread ? `<div class="card"><div class="card-title">Earlier messages ▾</div><div class="micro">You: Thanks for the previous update.<br/>${esc(m.sender)}: You're welcome!</div></div>` : '';
    const attach = extras.attachment ? `<div class="attachment"><div class="attach-icon">▤</div><div><div class="card-title">Preview.pdf</div><div class="micro">240 KB · Preview</div></div></div>` : '';
    const suggestion = extras.suggest?`<div class="chip-line"><span class="chip blue">Looks great!</span><span class="chip">Thanks!</span></div>`:'';
    swap(header('Message',{back:true,right:'more'})+
      `<div class="read-progress"><i id="progress"></i></div><div class="ui-body"><div class="view view-pad" id="readerView">
        <h2 class="reader-subject">${esc(m.subject)}</h2><div class="sender-line">${avatar(m)}<div class="sender-meta"><strong>${esc(m.sender)}</strong><small>To me · ${esc(m.time)}</small></div></div>
        <p class="body-copy">Hi there,</p><p class="body-copy">${esc(m.body)}</p>${summary}${thread}${attach}${suggestion}
        <div class="chip-line"><span class="chip">↩ Reply</span><span class="chip">↪ Forward</span><span class="chip">☆ Star</span></div>
      </div></div>`,'reader');
  }
  function compose(opts={}) {
    const sendTitle=opts.reply?'Reply':opts.forward?'Forward':'Compose';
    const to=opts.to||'';
    const subject=opts.subject||'';
    const body=opts.body||'';
    const attachment=opts.file?`<div class="attachment"><div class="attach-icon">▤</div><div><div class="card-title">concept.pdf</div><div class="micro">Preparing attachment</div><div class="attach-progress"><i id="uploadBar"></i></div></div></div>`:'';
    swap(header(sendTitle,{back:true,right:'send'})+`<div class="ui-body"><div class="view view-pad">
      <div class="field"><b>To</b><span id="toValue">${esc(to)}</span>${opts.chip?'<span class="chip blue">✓</span>':''}</div>
      <div class="field"><b>Subj.</b><span id="subjectValue">${esc(subject)}</span></div>
      <div class="compose-body" id="typingBody">${esc(body)}<i class="caret"></i></div>${attachment}
      <div class="chip-line"><span class="chip">▤ Attach</span><span class="chip">◷ Schedule</span></div>
      </div></div>${opts.keyboard?'<div class="mock-keyboard">'+Array(40).fill('<i></i>').join('')+'</div>':''}`,'compose');
  }
  function search(query='',results=null){
    const r=results || messages.filter(m=>m.folder==='Inbox' && `${m.sender} ${m.subject}`.toLowerCase().includes(query.toLowerCase()));
    swap(header('Search',{back:true,right:'close'})+`<div class="ui-body"><div class="view"><div class="search-entry">⌕ <span class="query" id="searchQuery">${esc(query)}</span><i class="caret"></i></div><div class="search-results-label">${r.length} RESULTS</div>${r.slice(0,5).map(m=>row(m,true)).join('')}</div></div>`,'search');
  }
  function folders(){
    const names=['Inbox','Starred','Sent','Drafts','Scheduled','Archive','Trash','Spam','Settings'];
    const signs=['✉','☆','➤','▤','◷','▱','⌫','⚑','⚙'];
    swap(header('Mailboxes',{back:true,right:'more'})+`<div class="ui-body"><div class="view">${names.map((name,i)=>`<div class="folder-row"><span class="folder-ico">${signs[i]}</span>${name}<strong>${i===0?count():i===2?'3':i===3?'1':''}</strong></div>`).join('')}</div></div>`,'folders');
  }
  function showOptions(title,values){
    swap(header(title,{back:true,right:'more'})+`<div class="ui-body"><div class="view"><div class="sheet">${values.map((v,i)=>`<div class="option-row"><span class="folder-ico">${v[0]}</span>${v[1]}${v[2]?`<span class="menu-indicator"></span>`:''}</div>`).join('')}</div></div></div>`,'options');
  }
  function calendar(status='Pending'){
    swap(header('Invitation',{back:true,right:'more'})+`<div class="ui-body"><div class="view view-pad"><div class="eyebrow">Calendar invitation</div><div class="reader-subject">Design review</div><div class="card"><div class="card-title">▦ Thursday · 10:30 AM</div><div class="micro">30 minutes · Video meeting<br/>Organized by Product Team</div></div><div class="chip-line"><span class="chip ${status==='Accepted'?'blue':''}">✓ Accept</span><span class="chip ${status==='Declined'?'blue':''}">✕ Decline</span></div><div class="content-note" style="margin-top:9px">${esc(status==='Pending'?'Respond to this invitation':`Response: ${status}`)}</div></div></div>`,'calendar');
  }
  function gallery(open=false){
    swap(header(open?'Gallery preview':'Design highlights',{back:true,right:'more'})+`<div class="ui-body"><div class="view view-pad"><div class="eyebrow">Dribbble · Curated</div><h2 class="reader-subject">New shots for you</h2>${open?'<div class="art" style="height:96px"></div>':'<div class="gallery"><div class="art"></div><div class="art"></div><div class="art"></div></div>'}<div class="micro" style="margin-top:8px">Creative UI inspiration, all in one place.</div><div class="chip-line"><span class="chip">♡ Save</span><span class="chip">Open preview</span></div></div></div>`,'gallery');
  }
  function settingsView(){
    const items=[['◉','Focus mode',settings.focus],['☼','Light appearance',settings.light],['♧','Privacy protection',settings.private],['◷','Notifications',settings.notifications]];
    swap(header('Settings',{back:true,right:'more'})+`<div class="ui-body"><div class="view"><div class="eyebrow" style="padding:10px 12px 2px">Your experience</div>${items.map(([ico,title,on])=>`<div class="option-row"><span class="folder-ico">${ico}</span>${title}<span class="toggle ${on?'on':''}"><i></i></span></div>`).join('')}<div class="ui-footnote">Demo settings · No account connected</div></div></div>`,'settings');
  }
  function privacy(){
    swap(header('Privacy center',{back:true,right:'more'})+`<div class="ui-body"><div class="view view-pad"><div class="eyebrow">Protected by design</div><div class="card"><div class="card-title">◈ Demo protection</div><div class="micro">Suspicious mail identified. Control your privacy preferences from one place.</div></div><div class="chip-line"><span class="chip blue">✓ Protection on</span></div></div></div>`,'privacy');
  }
  function schedule(){
    swap(header('Schedule send',{back:true,right:'more'})+`<div class="ui-body"><div class="view view-pad"><div class="eyebrow">Pick a date</div><div class="card-title">November 2026</div><div class="schedule-day">${['M','T','W','T','F','S','S','16','17','18','19','20','21','22'].map(s=>`<span class="${s==='19'?'selected':''}">${s}</span>`).join('')}</div><div class="card"><div class="micro">Thu 19 Nov · 9:00 AM</div></div><div class="chip-line"><span class="chip blue">Schedule</span></div></div></div>`,'schedule');
  }
  function success(text='Message sent'){
    swap(header('Success',{back:true,right:'more'})+`<div class="ui-body"><div class="view centered"><div class="checkmark">✓</div><div class="card-title">${esc(text)}</div><div class="micro">Your GrapMail demo was updated.</div><div class="chip-line" style="justify-content:center"><span class="chip">Undo</span></div></div></div>`,'success');
  }
  function folderIntro(name){
    const items = name==='Sent' ? [{sender:'You',subject:'Re: Workspace digest',preview:'Thanks! That looks great.',time:'Now',initials:'Y',color:'blue',id:'sent1',unread:false}] :
      name==='Drafts' ? [{sender:'Draft',subject:'Project feedback',preview:'A few thoughts for tomorrow…',time:'8:22',initials:'D',color:'violet',id:'draft1',unread:false}] :
      name==='Scheduled' ? [{sender:'Scheduled',subject:'Project proposal',preview:'Thu 9:00 AM',time:'Nov 19',initials:'S',color:'blue',id:'scheduled1',unread:false}] :
      name==='Archive' ? [{sender:'Analytics',subject:'Monthly report ready',preview:'Report archived',time:'Fri',initials:'A',color:'green',id:'archive1',unread:false}] :
      name==='Trash' ? [{sender:'Weekend Picks',subject:'Today’s highlights',preview:'Moved to Trash',time:'Mon',initials:'W',color:'amber',id:'trash1',unread:false}] :
      name==='Spam' ? [{sender:'Unknown sender',subject:'Suspicious offer',preview:'Potentially unsafe',time:'8:13',initials:'!',color:'amber',id:'spam1',unread:false}] : [];
    swap(header(name,{back:true,right:'search',count:items.length})+`<div class="ui-body"><div class="view">${items.map(m=>row(m,true)).join('')||'<div class="ui-footnote">Nothing here</div>'}</div></div>`,'folder');
  }
  function quick(){
    showOptions('Quick actions',[['✉','Compose now',true],['◷','Snooze mail',false],['☆','Star priority',false],['➤','Schedule send',false]]);
  }
  function zero(){
    swap(header('Inbox',{back:true,right:'more',count:0})+`<div class="ui-body"><div class="view centered"><div class="zero-icon">✧</div><div class="card-title">Inbox Zero</div><div class="micro">A little breathing room.<br/>You're all caught up.</div></div></div>`,'zero');
  }
  function touch(x,y,kind='tap'){
    cursor.classList.remove('tap');cursor.style.left=`${x/232*100}%`;cursor.style.top=`${y/281*100}%`;
    cursor.classList.add('show');
    if(kind==='tap'){void cursor.offsetWidth;cursor.classList.add('tap')}
  }
  function noTouch(){cursor.classList.remove('show','tap')}
  async function clickAt(x=115,y=100){touch(x,y);await delay(CLOCK.tap);noTouch()}
  async function go(fn,x=110,y=125,hold=600){await clickAt(x,y);fn();await delay(hold)}
  function burst(kind='spark'){
    const el=document.createElement('div');el.className=kind==='mail'?'effect-mail':kind==='plane'?'effect-plane':kind==='sync'?'effect-sync':'effect-spark';
    if(kind==='plane')el.textContent='➤';
    fx.appendChild(el);
    setTimeout(()=>el.remove(),kind==='sync'?850:900);
  }
  function tripleMail(){
    for(let i=0;i<3;i++){
      const e=document.createElement('div');e.className='effect-mail'+(i===1?' two':i===2?' three':'');fx.appendChild(e);setTimeout(()=>e.remove(),1050);
    }
    hero.classList.remove('envelope-breathe');void hero.offsetWidth;hero.classList.add('envelope-breathe');
    setTimeout(()=>hero.classList.remove('envelope-breathe'),500);
  }
  function ping(which){const el=document.getElementById(which==='shield'?'shieldBadge':'boltBadge');el.classList.remove('ping');void el.getBoundingClientRect();el.classList.add('ping');setTimeout(()=>el.classList.remove('ping'),450)}
  function notify(text){
    clearTimeout(toastJob);notice.innerHTML='<i class="dot"></i><span>'+esc(text)+'</span>';notice.classList.add('show');
    toastJob=setTimeout(()=>notice.classList.remove('show'),900);
  }
  async function swipe(direction,id){
    const rowEl=surface.querySelector(`[data-id="${id}"]`);
    if(rowEl){touch(direction==='right'?42:190,145,'drag');const delta=direction==='right'?170:-170;
      if(!reduceMotion)rowEl.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${delta}px)`,opacity:0}],{duration:330,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
      await delay(320);noTouch();}
  }
  async function fakeTyping(id,value,speed=85){
    const el=document.getElementById(id); if(!el)return;
    const s=String(value);
    for(let i=1;i<=s.length;i+=2){
      const target=document.getElementById(id);if(!target)break;
      target.textContent=s.slice(0,Math.min(s.length,i+1));
      await delay(speed);
    }
  }
  async function readerScroll(){
    const v=document.getElementById('readerView');if(!v)return;
    const bar=document.getElementById('progress');if(bar)bar.style.width='100%';
    if(!reduceMotion)v.scrollTo({top:96,behavior:'smooth'});else v.scrollTop=96;
    await delay(500);v.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
  }
  async function showFor(fn,ms=650){fn();await delay(ms)}
  async function autoStory(){
    for(;;){
      loop++;
      init();
      // 01. The EXACT frame stays planted inside the envelope at all times.
      inbox();
      await delay(200);tripleMail();ping('shield');await delay(750);
      notify('New message received');ping('bolt');burst('spark');
      await delay(720);
      // 02. Incoming mail slides into a real DOM list; unread counter updates.
      messages.unshift({id:'hello',sender:'GrapMail',initials:'G',color:'blue',subject:'Welcome to your inbox',preview:'Your private space starts here.',time:'Now',category:'Updates',folder:'Inbox',unread:true,body:'Welcome! A cleaner way to stay connected. This is an automated sample tour.',star:false,pin:false,label:'',snooze:false});
      inbox('Inbox','All');
      const fresh=surface.querySelector('[data-id="hello"]');
      if(fresh && !reduceMotion)fresh.animate([{transform:'translateY(-40px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:330,easing:'cubic-bezier(.2,.8,.2,1)'});
      await delay(750);
      // 03–09. Read, scroll, thread, summary, suggestions, reply and send.
      await go(()=>reader('notion'),105,99,680);
      await readerScroll();await delay(340);
      await go(()=>reader('notion',{thread:true}),135,175,580);
      await go(()=>reader('notion',{summary:true,thread:true,suggest:true}),168,131,790);
      await go(()=>compose({reply:true,to:'Notion',subject:'Re: Your workspace digest',body:'',keyboard:true,chip:true}),105,172,550);
      await fakeTyping('typingBody','Thanks! Looks great.',60);
      await delay(270);
      await clickAt(216,31);burst('plane');await delay(280);
      await showFor(()=>success('Reply sent'),550);notify('Sent · Undo');await delay(420);
      await go(()=>compose({forward:true,to:'team@grapmail.demo',subject:'Fwd: Workspace digest',body:'Sharing this update.',chip:true}),18,30,370);
      await clickAt(213,31);burst('plane');await showFor(()=>success('Forwarded'),420);
      await go(()=>inbox(),23,28,430);
      // 10. Read a calendar invitation; accept, then show changed response.
      await go(()=>reader('calendar'),115,177,420);
      await go(()=>calendar(),128,151,670);
      await go(()=>calendar('Declined'),168,179,350);
      await go(()=>calendar('Accepted'),75,179,500);burst('spark');
      // 11–13. Rich content and attachment preview.
      await go(()=>inbox(),22,28,340);
      await go(()=>gallery(false),126,203,720);
      await go(()=>gallery(true),110,160,650);
      await go(()=>reader('dribbble',{attachment:true}),125,173,480);
      await delay(300);
      // 14–15. Expand search + live results as letters type.
      await go(()=>search('',messages.filter(m=>m.folder==='Inbox')),210,30,250);
      for(const q of ['d','de','des','desi','design']){
        search(q);
        await delay(155);
      }
      await delay(500);
      await go(()=>inbox('Inbox','Work'),23,29,540);
      await go(()=>inbox('Inbox','Social'),140,78,480);
      await go(()=>inbox('Inbox','Updates'),191,78,500);
      await go(()=>inbox('Inbox','All'),48,78,290);
      // 16–17. Swipe to archive & undo, then delete & undo.
      await swipe('right','hello');lastArchived=messages.find(m=>m.id==='hello');lastArchived.folder='Archive';inbox();notify('Archived · Undo');await delay(540);
      await clickAt(125,24);lastArchived.folder='Inbox';inbox();notify('Undo complete');await delay(350);
      await swipe('left','hello');messages.find(m=>m.id==='hello').folder='Trash';inbox();notify('Moved to Trash · Undo');await delay(400);
      await clickAt(130,24);messages.find(m=>m.id==='hello').folder='Inbox';inbox();await delay(300);
      // 18–21. Star, pin, label and long-press selection; all inside frame.
      await clickAt(189,157);const n=messages.find(m=>m.id==='notion');n.star=true;inbox();notify('Starred ★');await delay(400);
      await clickAt(191,158);n.pin=true;inbox();notify('Pinned to top');await delay(410);
      await go(()=>showOptions('Label message',[['◆','Work',true],['◆','Personal',false],['◆','Follow up',false]]),190,172,480);
      n.label='Work';await go(()=>inbox(),125,140,510);
      touch(92,144,'drag');await delay(420);noTouch();inbox('Inbox','All',true);await delay(470);
      notify('2 messages selected');await delay(380);
      await go(()=>showOptions('Bulk actions',[['▱','Archive selected',true],['☆','Star selected',false],['✓','Mark as read',false]]),202,31,500);
      await go(()=>inbox(),23,29,350);
      // 22–24. Snooze, simulated reordering, pull-to-refresh and sync.
      await go(()=>showOptions('Snooze until',[['◷','Later today',true],['▦','Tomorrow morning',false],['▦','Next week',false]]),148,161,500);
      messages.find(m=>m.id==='team').snooze=true;inbox();notify('Snoozed until tomorrow');await delay(470);
      const team=messages.find(m=>m.id==='team');team.pin=true;
      inbox();notify('Priority mail moved to top');await delay(540);
      touch(104,108,'drag');burst('sync');await delay(520);noTouch();tripleMail();notify('Inbox refreshed');await delay(600);
      // 25–31. Real compose page with recipient chips, simulated keyboard, attachment, progress, schedule and send.
      ping('bolt');await showFor(()=>quick(),400);
      await go(()=>compose({to:'',subject:'',body:'',keyboard:true}),112,118,460);
      await fakeTyping('toValue','alex@example.com',56);
      await delay(140);
      compose({to:'alex@example.com',subject:'Project update',body:'',chip:true,keyboard:true});await delay(330);
      await fakeTyping('typingBody','Hi Alex, here is the latest update.',50);
      await delay(300);
      compose({to:'alex@example.com',subject:'Project update',body:'Hi Alex, here is the latest update.',chip:true,file:true});await delay(200);
      const bar=document.getElementById('uploadBar');if(bar)bar.style.width='100%';await delay(700);
      await go(()=>schedule(),159,178,620);
      await clickAt(122,185);burst('plane');await showFor(()=>success('Send scheduled'),650);
      await go(()=>compose({to:'design@grapmail.demo',subject:'Design review',body:'Looks perfect.',chip:true}),21,30,480);
      await clickAt(214,31);burst('plane');await showFor(()=>success('Message sent'),700);notify('Sent · Undo');await delay(470);
      // 32–36. Mailboxes and folder navigation in-place, never full-screen.
      await go(()=>folders(),19,30,620);
      for(const [name,y] of [['Sent',121],['Drafts',154],['Scheduled',185],['Archive',220],['Trash',242]]){
        await go(()=>folderIntro(name),105,Math.min(y,210),440);
        await go(()=>folders(),19,30,230);
      }
      await go(()=>folderIntro('Spam'),119,208,430);
      await go(()=>privacy(),125,145,670);ping('shield');
      // 37–40. Automatic security, focus, light theme and back to dark.
      await go(()=>settingsView(),23,30,430);
      settings.focus=true;await go(()=>settingsView(),185,96,410);
      settings.light=true;screen.classList.add('light');await go(()=>settingsView(),192,136,600);
      settings.light=false;screen.classList.remove('light');await go(()=>settingsView(),192,136,460);
      settings.notifications=false;await go(()=>settingsView(),190,202,340);
      settings.notifications=true;settings.focus=false;
      // 41. Floating lightning triggers an animated quick-action menu INSIDE the phone.
      ping('bolt');await go(()=>quick(),205,31,600);
      await go(()=>compose({to:'team@grapmail.demo',subject:'Quick note',body:'On it!',chip:true}),116,118,480);
      await clickAt(212,31);burst('plane');await showFor(()=>success('Quick note sent'),530);
      // 42–44. Scheduled demo, spam detection and temporary Inbox Zero celebration.
      await go(()=>folderIntro('Scheduled'),22,30,530);
      await go(()=>folderIntro('Spam'),23,30,480);ping('shield');notify('Suspicious message filtered');await delay(400);
      await go(()=>zero(),23,29,750);burst('spark');
      // 45. Finish where we started; restart automatically without changing SVG frame.
      await go(()=>inbox('Inbox','All'),23,29,870);
      notify('Tour replaying');await delay(650);
    }
  }
  init();inbox();
  window.GrapMailTour = Object.freeze({version:'2.0', mode:'autoplay-locked-mailbox',getFrame:()=>({x:79,y:52,width:242,height:292}), getScene:()=>current, getCycle:()=>loop});
  autoStory().catch(err=>{console.error('GrapMail demo error:',err);init();inbox()});
})();
</script>
