name: GrapMail
options:
  bundleIdPrefix: com.grapsee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GrapMail:
    type: application
    platform: iOS
    sources:
      - GrapMail
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  GrapMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrapMailUITests
    dependencies:
      - target: GrapMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail.uitests
        TEST_TARGET_NAME: GrapMail
schemes:
  GrapMail:
    build:
      targets:
        GrapMail: all
    run:
      config: Debug
