name: GrapMail
options:
  bundleIdPrefix: com.grapsee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# swift-crypto is Apple's own package (the CryptoKit-compatible API surface).
# It is here for one reason: CryptoKit itself has no X25519 key agreement and
# no HKDF, and the GrapMail envelope is X25519+HKDF-SHA256+AES-256-GCM by
# construction (`services/mail-service/src/e2e/envelope.ts`). Everything the
# browser and Android already run, this platform must run byte-identically --
# a key derivation that differs by one byte makes mail written on one device
# undecryptable on every other, forever.
packages:
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
  # Brand logos (BIMI) arrive as SVG, which ImageIO cannot draw. SwiftDraw is a
  # pure-Swift SVG renderer with no dependencies of its own; the server has
  # already refused any SVG that could run or load anything.
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    from: 0.18.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    # One release, one version: Android's release gate ties versionName to the
    # tag (v0.3.0's first run refused a disagreeing build), and an iOS build of
    # the same commit self-reporting 0.0.0.1 is the same disagreement kept
    # quiet only because no iOS badging check exists yet.
    MARKETING_VERSION: "0.6.4"
    CURRENT_PROJECT_VERSION: "13"
    # Empty on purpose for local development: a simulator build needs no team.
    # CI's release job injects the team per invocation with
    # DEVELOPMENT_TEAM="$APPLE_TEAM_ID" on the xcodebuild command line —
    # command-line assignments outrank project settings — so the committed
    # value never carries the team id and nothing local signs by accident.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GrapMail:
    type: application
    platform: iOS
    sources:
      - GrapMail
      - NotificationShared
      - WidgetShared
    dependencies:
      - target: GrapMailNotificationService
        embed: true
      - target: GrapMailWidget
        embed: true
      - package: Crypto
        product: Crypto
      - package: SwiftDraw
        product: SwiftDraw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: GrapMail/GrapMail.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.grapsee.grapmail
          - $(DEVELOPMENT_TEAM).com.grapsee.grapmail.notifications
        com.apple.developer.usernotifications.communication: true
        # The crate the widget reads (WidgetShared.swift). Nothing else lives
        # in it: the widget must never need a keychain, a session or a fetch.
        com.apple.security.application-groups:
          - group.com.grapsee.grapmail
    # XcodeGen writes the native launch configuration and other Info.plist entries.
    info:
      path: GrapMail/Info.plist
      properties:
        PreviewTeamIdentifier: $(DEVELOPMENT_TEAM)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchBrand
          UIImageRespectsSafeAreaInsets: true
        # Must exactly match MailPoll.refreshIdentifier's registration/submission.
        NSUserActivityTypes:
          - INSendMessageIntent
        # App lock (AppLock.swift) - the system needs a reason string before it
        # will ever show the Face ID sheet.
        NSFaceIDUsageDescription: "GrapMail uses Face ID to keep your mailbox private when the app is locked."
        # The send-later Live Activity; the start request is refused at runtime
        # without this key.
        NSSupportsLiveActivities: true
        # The widget and the Live Activity tap through to grapmail://scheduled
        # - the Scheduled screen, which is where cancel actually lives.
        CFBundleURLTypes:
          - CFBundleURLName: com.grapsee.grapmail
            CFBundleURLSchemes:
              - grapmail
        BGTaskSchedulerPermittedIdentifiers:
          - com.grapsee.grapmail.inbox-refresh
        # Background fetch also covers devices where APNs delivery is unavailable.
        UIBackgroundModes:
          - fetch
          - remote-notification
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.grapsee.grapmail.compose
            UIApplicationShortcutItemTitle: "Compose mail"
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose

  GrapMailNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - NotificationShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail.NotificationService
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: NotificationService/Info.plist
      properties:
        PreviewTeamIdentifier: $(DEVELOPMENT_TEAM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(DEVELOPMENT_TEAM).com.grapsee.grapmail.notifications
        com.apple.developer.usernotifications.communication: true

  # -- the widget extension -------------------------------------------------
  # Home/Lock Screen widget + send-later Live Activity. A separate process on
  # the shared App Group (WidgetShared.swift), with no network of its own: it
  # draws the numbers the app last read and mirrors the server's schedule.
  GrapMailWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - GrapMailWidget
      - WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: GrapMailWidget/Info.plist
      properties:
        CFBundleDisplayName: GrapMail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GrapMailWidget/GrapMailWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.grapsee.grapmail

  GrapMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrapMailUITests
    dependencies:
      - target: GrapMail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail.uitests
        TEST_TARGET_NAME: GrapMail
schemes:
  GrapMail:
    build:
      targets:
        GrapMail: all
        GrapMailUITests: [test]
    test:
      targets:
        - GrapMailUITests
    run:
      config: Debug
