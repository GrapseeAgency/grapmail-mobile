name: GrapMail
options:
  bundleIdPrefix: com.grapsee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# swift-crypto is Apple's own package (the CryptoKit-compatible API surface).
# It is here for one reason: CryptoKit itself has no X25519 key agreement and
# no HKDF, and the GrapMail envelope is X25519+HKDF-SHA256+AES-256-GCM by
# construction (`services/mail-service/src/e2e/envelope.ts`). Everything the
# browser and Android already run, this platform must run byte-identically --
# a key derivation that differs by one byte makes mail written on one device
# undecryptable on every other, forever.
packages:
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    # One release, one version: Android's release gate ties versionName to the
    # tag (v0.3.0's first run refused a disagreeing build), and an iOS build of
    # the same commit self-reporting 0.0.0.1 is the same disagreement kept
    # quiet only because no iOS badging check exists yet.
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "9"
    # Empty on purpose for local development: a simulator build needs no team.
    # CI's release job injects the team per invocation with
    # DEVELOPMENT_TEAM="$APPLE_TEAM_ID" on the xcodebuild command line —
    # command-line assignments outrank project settings — so the committed
    # value never carries the team id and nothing local signs by accident.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GrapMail:
    type: application
    platform: iOS
    sources:
      - GrapMail
    dependencies:
      - package: Crypto
        product: Crypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: GrapMail/GrapMail.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    # The launch screen, the background mode and the home-screen shortcut are
    # dictionaries and arrays, not single build-setting values, so they cannot
    # ride on INFOPLIST_KEY_* (Xcode exposes only `UILaunchScreen_Generation`,
    # which synthesizes an EMPTY launch screen -- the plain blue rectangle the
    # app shipped with). XcodeGen writes the real Info.plist instead, and
    # GENERATE_INFOPLIST_FILE still fills the bundle keys it owns.
    info:
      path: GrapMail/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: LaunchBrand
          UIColorName: LaunchBackground
        # Must exactly match MailPoll.refreshIdentifier's registration/submission.
        BGTaskSchedulerPermittedIdentifiers:
          - com.grapsee.grapmail.inbox-refresh
        # Polling remains the delivery path until a backend APNs provider exists.
        UIBackgroundModes:
          - fetch
          - remote-notification
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.grapsee.grapmail.compose
            UIApplicationShortcutItemTitle: "Compose mail"
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose

  GrapMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrapMailUITests
    dependencies:
      - target: GrapMail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.grapmail.uitests
        TEST_TARGET_NAME: GrapMail
schemes:
  GrapMail:
    build:
      targets:
        GrapMail: all
        GrapMailUITests: [test]
    test:
      targets:
        - GrapMailUITests
    run:
      config: Debug
